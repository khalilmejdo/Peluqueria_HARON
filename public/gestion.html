<!DOCTYPE html>
<html lang="{{langue}}" data-devise="{{devise}}" data-symbole="{{symbole}}" data-activite="{{activite}}" data-clarte="{{clarte}}" data-salon="{{salon}}" class="page-gestion">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{titre}}</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="{{couleur}}">
<link rel="icon" href="/favicon.svg?t={{theme}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icones/180.png?t={{theme}}">
<link rel="manifest" href="/gestion.webmanifest">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/gestion.css">
<link rel="stylesheet" href="/theme.css?t={{theme}}" id="feuille-theme">
</head>
<body class="gestion">
<a class="saut" href="#principal">{{saut}}</a>

<!--
  La coquille est vide : tout est construit par /js/gestion/app.js.
  Aucun script en ligne, aucun style en ligne : la politique de sécurité du
  contenu est stricte, et c'est elle qui rend une injection inoffensive.

  Les {{marqueurs}} sont remplis par le serveur au moment de servir la page —
  voir coquilleGestion() dans server/index.js. C'est le seul moyen de donner sa
  langue à une application monopage sans script en ligne : l'attribut « lang »
  est déjà là quand le premier octet arrive, et app.js le lit.
-->
<div id="application" class="gestion__racine">
  <p class="chargement" id="chargement">{{chargement}}</p>
</div>

<div id="annonces" class="visuellement-cache" role="status" aria-live="polite"></div>

<script type="module" src="/js/gestion/app.js"></script>
</body>
</html>
