# =====================================================================
#  Peluquería HARON — déploiement sur une machine nue
#
#  Pensé pour Oracle Cloud Infrastructure, offre Always Free (ARM Ampere
#  A1), mais valable sur n'importe quel serveur avec Docker.
#
#  Trois conteneurs, et rien d'autre à installer :
#     caddy   entrée HTTPS, certificat Let's Encrypt automatique
#     app     l'application
#     base    PostgreSQL
#
#  Mise en route :
#     cp .env.example .env     puis renseigner (npm run keygen pour les clés)
#     docker compose -f docker-compose.oci.yml up -d --build
#
#  L'image se construit directement sur la machine : pas de registre à
#  gérer, et l'architecture (ARM ou x86) est forcément la bonne.
# =====================================================================
# ---------------------------------------------------------------------
#  Journaux bornés, pour les trois conteneurs.
#
#  Le pilote par défaut de Docker (json-file) n'a AUCUNE limite de taille.
#  L'application écrit une ligne par requête et Caddy une par accès : sur une
#  machine qui tourne des mois sans qu'on la regarde, ces fichiers grossissent
#  jusqu'à remplir le disque — et un disque plein arrête PostgreSQL, donc le
#  salon, un matin, sans prévenir.
#
#  Trente méga-octets par service suffisent largement à remonter plusieurs
#  jours en arrière quand on cherche ce qui s'est passé.
# ---------------------------------------------------------------------
x-journaux: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *journaux
    ports:
      - "80:80"
      - "443:443"
      # Pas d UDP : HTTP/3 est desactive dans le Caddyfile, et laisser le port
      # ouvert ferait patienter les navigateurs qui ont garde une vieille
      # annonce « Alt-Svc ». Ferme, la tentative echoue tout de suite et le
      # navigateur repasse en TCP sans que personne attende.
    environment:
      # Le ou les noms que Caddy sert. Par defaut, le seul DOMAINE.
      # Pour en servir deux le temps d une bascule, poser dans .env :
      #   DOMAINES=ancien.duckdns.org, nouveau.dedyn.io
      DOMAINES: ${DOMAINES:-${DOMAINE:?DOMAINE requis (ex. file.peluqueria-haron.com)}}
      COURRIEL_TLS: ${COURRIEL_TLS:?COURRIEL_TLS requis (avis d expiration Let s Encrypt)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Les autres sites de la machine (voir la fin du Caddyfile). Le dossier
      # est ignore par git : sa configuration reste ici et ne bloque plus les
      # mises a jour du salon.
      - ./caddy.d:/etc/caddy/conf.d:ro
      # Les certificats survivent aux redémarrages : sans ce volume, Caddy en
      # redemanderait à chaque fois et se ferait limiter par Let's Encrypt.
      - caddy_donnees:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    logging: *journaux
    build:
      context: .
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Fuseau du salon : c'est lui qui définit ce qu'est « aujourd'hui ».
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Madrid}
      TELEPHONE_INDICATIF_DEFAUT: ${TELEPHONE_INDICATIF_DEFAUT:-34}

      DATABASE_URL: postgresql://haron:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@base:5432/haron
      DATABASE_SSL: "off"

      APP_SECRET: ${APP_SECRET:?APP_SECRET requis}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY requis}
      APP_PASSWORD_PEPPER: ${APP_PASSWORD_PEPPER:?APP_PASSWORD_PEPPER requis}

      # L'adresse qu'encode le QR Code de la vitrine. Elle ne doit plus
      # changer une fois l'affiche imprimée.
      PUBLIC_URL: https://${DOMAINE}
      # Toutes les origines admises pour la protection CSRF. Avec plusieurs
      # noms, les lister ici aussi, separees par des virgules -- sinon le
      # second nom affiche les pages mais refuse le moindre formulaire.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${DOMAINE}}
      # Un seul relais devant l'application : Caddy.
      TRUST_PROXY: "true"
      TRUST_PROXY_HOPS: "1"
      SECURE_COOKIES: "true"
      ENABLE_HSTS: "true"

      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-haron}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

      WHATSAPP_ACTIF: ${WHATSAPP_ACTIF:-false}
      WHATSAPP_NUMERO_ID: ${WHATSAPP_NUMERO_ID:-}
      WHATSAPP_JETON: ${WHATSAPP_JETON:-}
      WHATSAPP_LANGUE: ${WHATSAPP_LANGUE:-fr}
      WHATSAPP_MODELE_CONFIRMATION: ${WHATSAPP_MODELE_CONFIRMATION:-}
      WHATSAPP_MODELE_APPROCHE: ${WHATSAPP_MODELE_APPROCHE:-}
      WHATSAPP_MODELE_TOUR: ${WHATSAPP_MODELE_TOUR:-}

      # Rapport d'erreurs. Vide, rien n'est envoyé nulle part.
      #
      # ATTENTION, PIÈGE DÉJÀ PAYÉ : un `.env` posé à côté de ce fichier sert à
      # REMPLACER les ${...} ci-dessous, il n'entre PAS tout seul dans le
      # conteneur. Une variable qu'on ajoute au `.env` sans la répéter ici
      # n'atteint jamais l'application — et, s'agissant de Sentry, rien ne le
      # dit : les erreurs partent simplement dans le vide.
      SENTRY_DSN: ${SENTRY_DSN:-}

      # Avis poussés vers les téléphones du personnel (npm run avisos:cles).
      # Vides, les avis sont éteints et rien d'autre ne change.
      WEBPUSH_CLE_PUBLIQUE: ${WEBPUSH_CLE_PUBLIQUE:-}
      WEBPUSH_CLE_PRIVEE: ${WEBPUSH_CLE_PRIVEE:-}
      WEBPUSH_SUJET: ${WEBPUSH_SUJET:-}
    depends_on:
      base:
        condition: service_healthy
    volumes:
      # Les photos du salon, envoyées depuis l'onglet « Galerie » de l'espace
      # de gestion. EN ÉCRITURE : l'application y enregistre ce que le gérant
      # envoie depuis son téléphone.
      #
      # Elles ne sont PAS dans l'image : un redéploiement ne les touche pas, et
      # elles partent dans la sauvegarde du dossier /opt/haron/photos.
      #
      # Le dossier doit appartenir à l'utilisateur 1000 (celui du conteneur,
      # et « ubuntu » sur l'hôte) : scripts/deployer.sh le crée ainsi. S'il a
      # été créé par root, l'écran de galerie le dit et donne la commande :
      #   sudo chown -R 1000:1000 /opt/haron/photos
      #
      # Les photos déposées à la main par scp, avant cet écran, sont reprises
      # d'elles-mêmes dans la galerie au démarrage suivant.
      - ./photos:/app/data/photos
    # Aucun port publié : l'application n'est joignable que par Caddy.
    expose:
      - "3000"
    # Un nom qui n'appartient qu'au salon.
    #
    # Sur une machine qui heberge une seconde application, le nom de service
    # « app » est presque toujours pris deux fois. Les deux conteneurs se
    # retrouvent alors sous le meme nom sur le reseau partage, et Docker en
    # designe un AU HASARD : le salon sert les pages de l autre site une fois
    # sur deux, sans la moindre erreur nulle part.
    #
    # C'est arrive le 25 septembre 2026. Le Caddyfile vise donc « haron-app ».
    networks:
      default:
        aliases:
          - haron-app

  base:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *journaux
    environment:
      POSTGRES_DB: haron
      POSTGRES_USER: haron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      # Le salon vit en Europe/Madrid ; les journaux de la base aussi.
      TZ: ${APP_TIMEZONE:-Europe/Madrid}
    volumes:
      - base:/var/lib/postgresql/data
      # Les sauvegardes atterrissent ici, lisibles depuis la machine.
      - ./sauvegardes:/sauvegardes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haron -d haron"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  base:
  caddy_donnees:
  caddy_config:
